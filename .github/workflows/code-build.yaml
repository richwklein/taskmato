name: Build

on:
  workflow_call:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: macos-26
    steps:
      # Steps are conditionally skipped rather than the job, so the
      # required status check is always registered. A job-level skip
      # leaves that check unreported, which blocks PRs that require it.
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: changes
        uses: ./.github/actions/detect-relevant-changes

      - name: Select Xcode
        if: steps.changes.outputs.relevant == 'true'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Sync version
        if: steps.changes.outputs.relevant == 'true'
        run: bash scripts/sync-version.sh

      - name: Build (Debug)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          xcodebuild build \
            -project app/Taskmato.xcodeproj \
            -scheme Taskmato \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Also compile Release: it uses whole-module optimization and excludes
      # DEBUG-only code (e.g. #if DEBUG previews), so it catches errors the Debug
      # build misses — the class of failure that broke `make archive`. No signing.
      - name: Build (Release)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          xcodebuild build \
            -project app/Taskmato.xcodeproj \
            -scheme Taskmato \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # The synchronized folder group copies unrecognized file types into Contents/Resources,
      # so the FSL LICENSE would otherwise ship inside the app. EXCLUDED_SOURCE_FILE_NAMES
      # keeps it out, but that setting is documented for source files, not resources.
      - name: Assert the Pro LICENSE is not bundled
        if: steps.changes.outputs.relevant == 'true'
        run: |
          APP="$(xcodebuild -project app/Taskmato.xcodeproj -scheme Taskmato \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk '$1 == "BUILT_PRODUCTS_DIR" { print $3; exit }')/Taskmato.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Release app bundle not found at $APP"
            exit 1
          fi
          if find "$APP" -name LICENSE | grep -q .; then
            echo "::error::LICENSE was copied into $APP — EXCLUDED_SOURCE_FILE_NAMES is not taking effect"
            find "$APP" -name LICENSE
            exit 1
          fi
          echo "LICENSE correctly excluded from $APP"
