name: Maintenance / cleanup task
description: Track upkeep, refactoring, cleanup, documentation, test, or process work.
title: '[Task]: '
labels: ['task']

body:
  - type: markdown
    attributes:
      value: |
        Use this for maintenance, cleanup, technical debt, test improvements, documentation work, or smaller implementation tasks.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be improved, cleaned up, updated, or maintained?
      placeholder: Describe the task.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Why this matters
      description: What pain, risk, inconsistency, or gap does this address?
      placeholder: Describe the value of doing this work.
    validations:
      required: false

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: What do you think should be done?
      placeholder: Outline the likely implementation or cleanup approach.
    validations:
      required: false

  - type: dropdown
    id: access
    attributes:
      label: Access
      description: >-
        Is this capability free, part of Taskmato Pro, or not yet decided? See
        ADR-0013 (docs/architecture/decisions/0013-plan-capabilities-independently-of-releases.md).
      options:
        - Free
        - Pro
        - Undecided
        - Not applicable
      default: 3
    validations:
      required: true

  - type: input
    id: governing-decision
    attributes:
      label: Governing decision
      description: The ADR, design doc, or issue that governs this work. Leave blank if there is none.
      placeholder: e.g. ADR-0013, design 0011, #540
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What parts of the repo, process, or content are affected?
      placeholder: e.g. tests, docs, image pipeline, CI
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How will you know this task is complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and readiness
      description: >-
        What must be true before this can start, and what signals it is ready to ship? Describe
        prerequisites and observable criteria — not a release number. GitHub milestones schedule
        the work; release notes record what shipped.
      placeholder: |
        - Blocked by: #...
        - Blocks: #...
        - Ready when: ...
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Add related issues, docs, logs, or links.
      placeholder: |
        - Related issue:
        - Doc:
        - Link:
    validations:
      required: false
