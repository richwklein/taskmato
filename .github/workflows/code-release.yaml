name: Release DMG

# Signs, notarizes, and attaches the DMG to the release-please-created DRAFT release,
# then publishes (un-drafts) it and deploys the marketing site — in that order.
#
# Why workflow_run instead of a tag/release trigger: with immutable releases enabled
# the DMG must be attached while the release is still a draft (a published release is
# frozen), but a draft release neither creates a git tag nor fires `release` events.
# So there is nothing to key a `push: tags` or `release:` trigger on. Instead this runs
# after the "Release" (release-please) workflow completes and looks the draft up by
# version — which keeps release-please.yaml untouched and template-tracked.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Determines whether release-please cut a draft release and, if so, the tag and the
  # exact release commit to build. Guarded to a successful push to main (the "Release"
  # workflow is push-to-main only), and it never checks out the workflow_run head SHA —
  # so no untrusted, event-derived code runs in this privileged context.
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    # contents: write (not read) — a draft release is only visible to a token with push
    # access, so `gh release view` on the draft needs write here to detect it.
    permissions:
      contents: write
    outputs:
      released: ${{ steps.detect.outputs.released }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      # Checks out github.sha (the trusted default-branch commit), not the workflow_run
      # head SHA, only to read version.txt.
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Detect draft release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No draft release for $TAG; nothing to package."
          fi

  # Builds, signs, notarizes, and attaches the DMG to the draft release. Checks out the
  # default-branch commit (github.sha, trusted) — never an event- or output-derived ref,
  # which CodeQL flags as untrusted checkout in this privileged workflow_run context. It
  # carries the just-released version.txt. --clobber is safe because the release is still
  # a draft (mutable) — this is the only place an upload may be retried.
  package:
    needs: check
    if: needs.check.outputs.released == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Decode notarization key
        env:
          NOTARYTOOL_AUTH_KEY_P8: ${{ secrets.NOTARYTOOL_AUTH_KEY_P8 }}
        run: |
          echo -n "$NOTARYTOOL_AUTH_KEY_P8" | base64 --decode -o "$RUNNER_TEMP/notarytool_key.p8"

      - name: Archive and package DMG
        run: make archive

      - name: Notarize and staple
        env:
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ secrets.NOTARYTOOL_ISSUER_ID }}
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          xcrun notarytool submit "build/Taskmato-${VERSION}.dmg" \
            --key "$RUNNER_TEMP/notarytool_key.p8" \
            --key-id "$NOTARYTOOL_KEY_ID" \
            --issuer "$NOTARYTOOL_ISSUER_ID" \
            --wait
          xcrun stapler staple "build/Taskmato-${VERSION}.dmg"

      - name: Attach DMG to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          gh release upload "$TAG" "build/Taskmato-${VERSION}.dmg#Taskmato.dmg" --clobber

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  # Publishes (un-drafts) the release. This is the single, final write to the release:
  # once published, immutable releases freeze it, so nothing may touch it afterward.
  # release-please already wrote the notes from the changelog, so we only flip the flag.
  # Publishing is automated; the DMG is smoke-tested after the fact, and a regression is
  # handled by cutting a patch release rather than gating this step on manual approval.
  publish:
    needs: [check, package]
    if: needs.check.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job has no checkout, so pass --repo explicitly; without it `gh release
      # edit` tries to infer the repo from local git and fails ("not a git repository").
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # Deploys the marketing site from the published tag. Read-only with respect to the
  # release; runs last so the download button (/releases/latest/download/Taskmato.dmg)
  # resolves to a published release with the DMG already attached.
  deploy-site:
    needs: [check, publish]
    if: needs.check.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site-deploy.yaml
    with:
      ref: ${{ needs.check.outputs.tag }}
