version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 20
    labels:
      - 'dependencies'
    groups:
      first-party-actions:
        patterns:
          - 'actions/*'
      third-party-actions:
        exclude-patterns:
          - 'actions/*'
  - package-ecosystem: npm
    directory: '/site'
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 20
    labels:
      - 'dependencies'
    ignore:
      # `typescript` majors are capped by two separate dev dependencies:
      #   typescript-eslint -> typescript >=4.8.4 <6.1.0   (breaks `lint`)
      #   @astrojs/check    -> typescript ^5.0.0 || ^6.0.0 (breaks `build`)
      # TS 7.0 also ships no programmatic compiler API, so typescript-eslint
      # refuses to load against it; a new API is expected in TS 7.1.
      # Lift this entry only once BOTH constraints have widened.
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '*eslint-plugin*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      prettier:
        patterns:
          - 'prettier*'
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      typescript:
        patterns:
          - 'typescript'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      other-dependencies:
        exclude-patterns:
          - 'astro'
          - '@astrojs/*'
          - 'eslint*'
          - '@eslint/*'
          - '*eslint-plugin*'
          - 'prettier*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'vitest'
          - '@vitest/*'
