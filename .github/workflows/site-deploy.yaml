name: Deploy Site
# Builds the marketing site from a given ref and deploys it to GitHub Pages. Invoked
# by release.yaml after a release is published (site deploys only happen on releases),
# or manually via workflow_dispatch for an out-of-band redeploy. Unlike site-build.yaml
# (the PR check), this always builds — no change-detection gating — since a deploy must
# always produce a fresh artifact.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build and deploy'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build and deploy (defaults to the triggering ref)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: cd site && pnpm install --frozen-lockfile

      - name: Build
        run: cd site && pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
