name: Test

on:
  workflow_call:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: macos-26
    steps:
      # Steps are conditionally skipped rather than the job, so the
      # required status check is always registered. A job-level skip
      # leaves that check unreported, which blocks PRs that require it.
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Detect relevant changes
        id: changes
        uses: ./.github/actions/detect-relevant-changes

      - name: Select Xcode
        if: steps.changes.outputs.relevant == 'true'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Sync version
        if: steps.changes.outputs.relevant == 'true'
        run: bash scripts/sync-version.sh

      - name: Run unit tests
        if: steps.changes.outputs.relevant == 'true'
        run: |
          xcodebuild test \
            -project app/Taskmato.xcodeproj \
            -scheme Taskmato \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Convert coverage to LCOV
        if: steps.changes.outputs.relevant == 'true'
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 scripts/xcresult-to-lcov.py coverage.json > coverage.lcov

      - name: Install lcov
        if: steps.changes.outputs.relevant == 'true'
        run: brew install lcov

      - name: Report coverage on PR
        if: steps.changes.outputs.relevant == 'true'
        uses: zgosalvez/github-actions-report-lcov@v7
        with:
          coverage-files: coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
